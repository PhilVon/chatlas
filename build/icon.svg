<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16052a"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#a259ff"/>
      <stop offset="100%" stop-color="#6b1fd4"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Chat bubble body -->
  <rect x="56" y="72" width="400" height="292" rx="48" fill="url(#bubble)"/>

  <!-- Chat bubble tail (pointing down-left) -->
  <path d="M 100 364 L 72 452 L 210 364 Z" fill="#6b1fd4"/>

  <!-- Message line 1 (full width) -->
  <rect x="104" y="136" width="304" height="36" rx="18" fill="white" opacity="0.95"/>

  <!-- Message line 2 (shorter) -->
  <rect x="104" y="204" width="244" height="36" rx="18" fill="white" opacity="0.88"/>

  <!-- Message line 3 (shortest) -->
  <rect x="104" y="272" width="176" height="36" rx="18" fill="white" opacity="0.80"/>
</svg>
